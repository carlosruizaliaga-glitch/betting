<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Betting">
  <title>Betting</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000; --card: #050d07; --text: #d7f5de; --muted: #6f9a7b; --line: #163a22; --line2: #0c2414;
      --pos: #00e676; --pos-soft: #00e67618; --money: #00c853; --money-dark: #003d1a;
      --neg: #ff5252; --neg-soft: #ff525218; --cyan: #4dd0e1; --yellow: #ffd54f; --purple: #b388ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0 !important; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
    header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
      padding: calc(8px + env(safe-area-inset-top)) 14px 8px; display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; }
    header h1 { margin: 0; font-size: 15px; letter-spacing: .12em; color: var(--pos); }
    #syncBtn { margin-left: auto; background: none; border: 0; padding: 6px 4px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; display: inline-block; background: var(--muted); }
    .dot.ok { background: var(--pos); } .dot.warn { background: var(--yellow); } .dot.err { background: var(--neg); }
    main { padding: 0 14px 24px; max-width: 680px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 12px; margin: 10px 0; }
    h2 { font-size: 11px; letter-spacing: .14em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
    h2 .acc { color: var(--cyan); }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos { color: var(--pos); } .neg { color: var(--neg); } .cyan { color: var(--cyan); } .yellow { color: var(--yellow); } .purple { color: var(--purple); }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hero .lbl { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
    .hero .big { font-size: 34px; font-weight: 800; line-height: 1.1; margin: 2px 0 4px; color: var(--text); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); margin-top: 10px; }
    .kpis > div { padding: 8px 4px 0; }
    .kpis .k { font-size: 10px; letter-spacing: .1em; color: var(--muted); }
    .kpis .v { font-weight: 800; font-size: 15px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 10px; letter-spacing: .08em; padding: 4px 4px; border-bottom: 1px solid var(--line); }
    .tbl td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line2); }
    .tbl th:first-child, .tbl td:first-child { text-align: left; }
    .tbl tr:last-child td { border-bottom: 0; }
    .list > .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line2); }
    .list > .item:first-child { border-top: 0; }
    .tap { cursor: pointer; }
    .tag { display: inline-block; font-size: 10px; letter-spacing: .06em; padding: 1px 5px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; }
    .tag.W, .tag.HW { color: var(--pos); border-color: var(--pos); } .tag.L, .tag.HL { color: var(--neg); border-color: var(--neg); }
    .tag.P { color: var(--yellow); border-color: var(--yellow); } .tag.V { color: var(--muted); } .tag.CO { color: var(--purple); border-color: var(--purple); }
    button { font: inherit; border: 1px solid var(--line); padding: 11px 14px; cursor: pointer; background: var(--card); color: var(--text); font-weight: 600; letter-spacing: .06em; }
    button.primary { background: var(--pos); border-color: var(--pos); color: #000; font-weight: 800; }
    button.danger { color: var(--neg); border-color: var(--neg); background: none; }
    button.small { padding: 6px 10px; font-size: 12px; }
    button.block { width: 100%; }
    button:disabled { opacity: .45; }
    .pend { border: 1px solid var(--line); border-left: 3px solid var(--yellow); padding: 10px; margin: 8px 0; background: var(--card); }
    .pend .btns { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; margin-top: 10px; }
    .pend .btns button { padding: 14px 4px; font-size: 13px; font-weight: 800; }
    .btn-w { color: var(--pos); border-color: var(--pos); background: var(--pos-soft); }
    .btn-l { color: var(--neg); border-color: var(--neg); background: var(--neg-soft); }
    .btn-v { color: var(--muted); }
    .fab { position: fixed; left: calc((100% - 64px) * 2 / 5 + 4px); bottom: calc(8px + env(safe-area-inset-bottom)); width: 56px; height: 56px;
      font-size: 30px; line-height: 1; padding: 0; background: var(--pos); border: 2px solid #000; color: #000; z-index: 8; font-weight: 800; box-shadow: 0 0 0 1px var(--pos); }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr 1fr; background: #000;
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav.tabs button { background: none; border: 0; padding: 9px 0 11px; font-size: 9px; letter-spacing: .06em;
      color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600; min-width: 0; }
    nav.tabs button .ic { font-size: 17px; line-height: 1.1; }
    nav.tabs button.active { color: var(--pos); }
    label { display: block; font-size: 10px; letter-spacing: .12em; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
    input, select, textarea { font: inherit; font-size: 16px; width: 100%; padding: 10px 11px; border: 1px solid var(--line); background: #000; color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--pos); outline-offset: -1px; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--pos); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chips button { padding: 7px 10px; font-size: 13px; font-weight: 600; background: #000; }
    .chips button.on { background: var(--pos); color: #000; border-color: var(--pos); }
    .scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .scroll-x button { flex: none; }
    .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .levels button { padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; background: #000; }
    .levels button b { font-size: 16px; }
    .levels button span { font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
    .levels button.on { background: var(--pos); border-color: var(--pos); color: #000; }
    .levels button.on span { color: #000; }
    .res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .res button { padding: 9px 2px; font-size: 11px; background: #000; }
    .res button.on[data-r=P] { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .res button.on[data-r=W], .res button.on[data-r=HW] { background: var(--pos); border-color: var(--pos); color: #000; }
    .res button.on[data-r=L], .res button.on[data-r=HL] { background: var(--neg); border-color: var(--neg); color: #000; }
    .res button.on[data-r=V] { background: var(--muted); border-color: var(--muted); color: #000; }
    .res button.on[data-r=CO] { background: var(--purple); border-color: var(--purple); color: #000; }
    .leg { display: grid; grid-template-columns: 1fr 92px 36px; gap: 5px; margin-bottom: 5px; }
    .leg button { padding: 0; }
    .preview { border: 1px solid var(--line); padding: 8px 10px; margin-top: 10px; display: flex; justify-content: space-between; font-size: 12px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: #000; border-top: 1px solid var(--pos); width: 100%; max-width: 680px; max-height: 94vh; overflow-y: auto;
      padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .14em; color: var(--pos); }
    .actions { display: flex; gap: 6px; margin-top: 16px; }
    .actions button { flex: 1; }
    .overlay.dialog { z-index: 40; align-items: center; padding: 16px; }
    .dlg { background: #000; border: 1px solid var(--pos); width: 100%; max-width: 380px; padding: 16px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 12px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom));
      background: var(--pos); color: #000; padding: 9px 14px; z-index: 50; font-size: 13px; font-weight: 600; max-width: 90vw; text-align: center; }
    .banner { border: 1px solid var(--neg); background: var(--neg-soft); color: var(--neg); padding: 10px 12px; margin: 10px 0; font-size: 13px; font-weight: 800; letter-spacing: .04em; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .chart .tip { position: absolute; top: 0; pointer-events: none; background: #000; border: 1px solid var(--pos); padding: 4px 7px; font-size: 11px; white-space: nowrap; display: none; }
    .datehdr { font-size: 10px; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 14px 0 0; }
    .filters select { font-size: 13px; padding: 7px 8px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .login { max-width: 400px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px 40px; text-align: center; }
    .login img { width: 120px; height: 120px; }
    .login h1 { margin: 12px 0 4px; letter-spacing: .2em; color: var(--pos); }
    .login .card { text-align: left; }
    .seg { display: flex; border: 1px solid var(--line); }
    .seg button { flex: 1; border: 0; padding: 8px 2px; font-size: 11px; background: none; color: var(--muted); }
    .seg button.on { background: var(--pos); color: #000; }
    .kv { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line2); font-size: 13px; }
    .kv:last-child { border-bottom: 0; }
    .listedit .chips button { padding-right: 6px; }
    .listedit .chips button i { font-style: normal; color: var(--neg); margin-left: 6px; }
    body.noapp header, body.noapp nav.tabs, body.noapp .fab { display: none; }
  </style>
</head>
<body class="noapp">
  <header>
    <img src="favicon.png" alt="">
    <h1>BETTING</h1>
    <button id="syncBtn" aria-label="Sincronizar"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></button>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Nueva apuesta">+</button>
  <nav class="tabs">
    <button data-tab="home" class="active"><span class="ic">◉</span>INICIO</button>
    <button data-tab="bets"><span class="ic">≡</span>APUESTAS</button>
    <span></span>
    <button data-tab="picks"><span class="ic">⚡</span>PICKS</button>
    <button data-tab="stats"><span class="ic">▲</span>STATS</button>
    <button data-tab="settings"><span class="ic">⚙</span>AJUSTES</button>
  </nav>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
