<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Betting">
  <title>Betting</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-b4.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180-b4.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Diseño v2 (25/10/2026): mismo color (negro + verde "de pasta"), acabado más fino como Zontes:
       esquinas suaves, bordes finos, superficies con leve relieve, barra flotante.
       JetBrains Mono para cifras y etiquetas; Inter para los textos. */
    :root {
      /* Fondo "verde tapete" (25/10/2026): casi negro con un toque de verde; tarjetas un escalón más claras. */
      --bg: #0f1e20; --card: #182b2e; --card2: #132427; --raise: #234044; --text: #eef5f3; --muted: #a0b8b5; --faint: #7d9693;
      --line: #2a4447; --line2: #1f373a;
      --pos: #52d3a6; --pos-soft: rgba(82, 211, 166, .13); --money: #52d3a6; --money-dark: #0f3a33;
      --neg: #ee706b; --neg-soft: rgba(238, 112, 107, .13);
      --cyan: #52d3a6; --cyan-soft: rgba(82, 211, 166, .13);
      --yellow: #ffd36e; --yellow-soft: rgba(255, 211, 110, .13);
      --purple: #b9a4e0; --purple-soft: rgba(185, 164, 224, .14);
      --r: 16px; --r-sm: 12px; --r-xs: 9px;
      --mono: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;   /* una sola letra en toda la app */
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 22px rgba(0, 0, 0, .35);
      --ac: #43e8c0;                       /* único color de acento */
      --brand: #43e8c0; --on-brand: #06201b;
    }
    :root[data-theme="light"] { --ac: #0a8f6f; }
    /* Modo claro (Ajustes → Apariencia): mismos colores de significado, más oscuros para leer sobre fondo claro */
    :root[data-theme="light"] {
      --bg: #f2f6f5; --card: #ffffff; --card2: #eef3f2; --raise: #e2e9e8; --text: #14201f; --muted: #566a68; --faint: #7d908e;
      --line: #d3dddb; --line2: #e2eae8;
      --pos: #0a8f6f; --pos-soft: rgba(10, 143, 111, .12); --money: #0a8f6f; --money-dark: #d6efe8;
      --neg: #d23f3f; --neg-soft: rgba(210, 63, 63, .1);
      --cyan: #0a8f6f; --cyan-soft: rgba(10, 143, 111, .12);
      --yellow: #9a6500; --yellow-soft: rgba(212, 150, 0, .14);
      --purple: #7452c0; --purple-soft: rgba(116, 82, 192, .12);
      --shadow: 0 1px 2px rgba(20, 32, 31, .08), 0 6px 16px rgba(20, 32, 31, .08);
    }
    :root[data-theme="light"] body { background: radial-gradient(120% 55% at 50% -10%, rgba(10, 143, 111, .07) 0%, rgba(242, 246, 245, 0) 60%) fixed, var(--bg); }
    :root[data-theme="light"] header { background: rgba(242, 246, 245, .85); }
    :root[data-theme="light"] { --brand: #0a8f6f; --on-brand: #ffffff; }
    :root[data-theme="light"] .sheet::before { background: rgba(20, 32, 31, .18); }
    :root[data-theme="light"] input[type=date], :root[data-theme="light"] input[type=time] { color-scheme: light; }
    :root[data-theme="light"] .overlay { background: rgba(20, 32, 31, .4); }
    :root[data-theme="light"] .pk.val, :root[data-theme="light"] .pkc.val { background: var(--pos-soft); border-color: rgba(10, 143, 111, .55); }
    :root[data-theme="light"] nav.tabs { background: rgba(255, 255, 255, .92); }
    /* Paletas (Ajustes → Apariencia → Colores). "Clásico" son los valores de :root; el resto, aquí, en oscuro y claro. */
    :root[data-palette="icono"] {
      --bg: #141311; --card: #201e1b; --card2: #1a1916; --raise: #2d2a26; --text: #f7f1e6; --muted: #b7ad9e; --faint: #8c8478;
      --line: #36322c; --line2: #292622;
      --ac: #ffd23f; --brand: #ffd23f; --on-brand: #1a1816;
      --cyan: #ffd23f; --cyan-soft: rgba(255, 210, 63, .14);
      --pos: #93c25f; --pos-soft: rgba(147,194,95, 0.14); --money: #93c25f;
      --yellow: #e9a24b; --yellow-soft: rgba(233,162,75, 0.14);
      --neg: #e2685c; --neg-soft: rgba(226,104,92, 0.14);
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 22px rgba(0, 0, 0, .4);
    }
    :root[data-theme="light"][data-palette="icono"] {
      --bg: #f7f2e8; --card: #fffdf8; --card2: #f3ede2; --raise: #e9e1d2; --text: #1a1816; --muted: #675f53; --faint: #958b7c;
      --line: #e0d6c5; --line2: #ece4d6;
      --ac: #a87a00; --brand: #ffd23f; --on-brand: #1a1816;
      --cyan: #8a6400; --cyan-soft: rgba(255, 196, 0, .2);
      --pos: #4a7a22; --pos-soft: rgba(74,122,34, 0.11); --money: #4a7a22;
      --yellow: #a9620f; --yellow-soft: rgba(169,98,15, 0.11);
      --neg: #b5433a; --neg-soft: rgba(181,67,58, 0.11);
      --shadow: 0 1px 2px rgba(20, 20, 20, .08), 0 6px 16px rgba(20, 20, 20, .08);
    }
    :root[data-palette="tapete"] {
      --bg: #0d1f17; --card: #15291f; --card2: #11231a; --raise: #1f3a2c; --text: #f3efe2; --muted: #a9b8a8; --faint: #7f907f;
      --line: #2a4535; --line2: #1d3428;
      --ac: #e8c25a; --brand: #e8c25a; --on-brand: #1b1406;
      --cyan: #e8c25a; --cyan-soft: rgba(232, 194, 90, .15);
      --pos: #a4d97c; --pos-soft: rgba(164,217,124, 0.14); --money: #a4d97c;
      --yellow: #e9a84b; --yellow-soft: rgba(233,168,75, 0.14);
      --neg: #ea7a62; --neg-soft: rgba(234,122,98, 0.14);
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 22px rgba(0, 0, 0, .4);
    }
    :root[data-theme="light"][data-palette="tapete"] {
      --bg: #f4f1e6; --card: #fffdf6; --card2: #efeadb; --raise: #e4dcc7; --text: #14231b; --muted: #5e6b5f; --faint: #8d978c;
      --line: #ddd5c2; --line2: #e9e2d2;
      --ac: #8a6a12; --brand: #e8c25a; --on-brand: #1b1406;
      --cyan: #7a5c0a; --cyan-soft: rgba(232, 194, 90, .24);
      --pos: #3b7a2e; --pos-soft: rgba(59,122,46, 0.11); --money: #3b7a2e;
      --yellow: #a8620f; --yellow-soft: rgba(168,98,15, 0.11);
      --neg: #b4403a; --neg-soft: rgba(180,64,58, 0.11);
      --shadow: 0 1px 2px rgba(20, 20, 20, .08), 0 6px 16px rgba(20, 20, 20, .08);
    }
    :root[data-palette="burdeos"] {
      --bg: #1a0f12; --card: #26161b; --card2: #201317; --raise: #352027; --text: #f7ece6; --muted: #c0a9a8; --faint: #937d7c;
      --line: #3d272d; --line2: #2e1d22;
      --ac: #f0b85a; --brand: #f0b85a; --on-brand: #24130a;
      --cyan: #f0b85a; --cyan-soft: rgba(240, 184, 90, .15);
      --pos: #a5c97c; --pos-soft: rgba(165,201,124, 0.14); --money: #a5c97c;
      --yellow: #efa253; --yellow-soft: rgba(239,162,83, 0.14);
      --neg: #f0786f; --neg-soft: rgba(240,120,111, 0.14);
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 22px rgba(0, 0, 0, .4);
    }
    :root[data-theme="light"][data-palette="burdeos"] {
      --bg: #f8f1ec; --card: #fffaf7; --card2: #f2e8e2; --raise: #e8dad2; --text: #2a1418; --muted: #6f5a5c; --faint: #9a8587;
      --line: #e3d3cc; --line2: #eee3dd;
      --ac: #8f5c12; --brand: #f0b85a; --on-brand: #24130a;
      --cyan: #7d4f0c; --cyan-soft: rgba(240, 184, 90, .24);
      --pos: #4b7a36; --pos-soft: rgba(75,122,54, 0.11); --money: #4b7a36;
      --yellow: #a85d10; --yellow-soft: rgba(168,93,16, 0.11);
      --neg: #a82c3c; --neg-soft: rgba(168,44,60, 0.11);
      --shadow: 0 1px 2px rgba(20, 20, 20, .08), 0 6px 16px rgba(20, 20, 20, .08);
    }
    :root[data-palette="grafito"] {
      --bg: #121417; --card: #1c1f23; --card2: #171a1d; --raise: #272b30; --text: #f1f3f5; --muted: #a7adb5; --faint: #7d848c;
      --line: #30353b; --line2: #23272c;
      --ac: #ffffff; --brand: #f1f3f5; --on-brand: #121417;
      --cyan: #f1f3f5; --cyan-soft: rgba(241, 243, 245, .1);
      --pos: #6dc18d; --pos-soft: rgba(109,193,141, 0.14); --money: #6dc18d;
      --yellow: #e8a94d; --yellow-soft: rgba(232,169,77, 0.14);
      --neg: #e5706b; --neg-soft: rgba(229,112,107, 0.14);
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 22px rgba(0, 0, 0, .4);
    }
    :root[data-theme="light"][data-palette="grafito"] {
      --bg: #f4f5f7; --card: #ffffff; --card2: #eef0f2; --raise: #e2e5e9; --text: #15181b; --muted: #5d636b; --faint: #8a9098;
      --line: #dde0e4; --line2: #e8eaed;
      --ac: #15181b; --brand: #15181b; --on-brand: #ffffff;
      --cyan: #15181b; --cyan-soft: rgba(21, 24, 27, .07);
      --pos: #2c7a4f; --pos-soft: rgba(44,122,79, 0.11); --money: #2c7a4f;
      --yellow: #a8620f; --yellow-soft: rgba(168,98,15, 0.11);
      --neg: #b53b3b; --neg-soft: rgba(181,59,59, 0.11);
      --shadow: 0 1px 2px rgba(20, 20, 20, .08), 0 6px 16px rgba(20, 20, 20, .08);
    }
    :root:not([data-palette="clasico"]) .chips button.on { background: color-mix(in srgb, var(--brand) 18%, transparent); border-color: color-mix(in srgb, var(--brand) 55%, transparent); }
    :root:not([data-palette="clasico"]) header { background: color-mix(in srgb, var(--bg) 85%, transparent); }
    :root:not([data-palette="clasico"]) nav.tabs button.active { color: var(--text); background: color-mix(in srgb, var(--brand) 26%, transparent); }
    :root:not([data-palette="clasico"]) nav.tabs button.active .ic { color: var(--ac); }
    :root:not([data-palette="clasico"]) .pk.val, :root:not([data-palette="clasico"]) .pkc.val { border-color: color-mix(in srgb, var(--brand) 70%, transparent); background: color-mix(in srgb, var(--brand) 13%, transparent); }
    :root:not([data-palette="clasico"]) .pk.val .o, :root:not([data-palette="clasico"]) .pkc.val .o { color: var(--ac); }
    :root:not([data-palette="clasico"]) .pk.fav, :root:not([data-palette="clasico"]) .pkc.fav { border-color: color-mix(in srgb, var(--text) 35%, transparent); }
    :root:not([data-palette="clasico"]) .pk.fav .o, :root:not([data-palette="clasico"]) .pkc.fav .o { color: var(--text); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(150px + env(safe-area-inset-bottom));
      background: radial-gradient(120% 55% at 50% -10%, color-mix(in srgb, var(--ac) 7%, transparent) 0%, transparent 60%) fixed, var(--bg); }
    header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line2); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; border-radius: 8px; }
    header h1 { margin: 0; font: 700 14px/1 var(--mono); letter-spacing: .14em; color: var(--text); }
    header h1::first-letter { color: var(--ac); }
    .eye { margin-left: auto; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
    .eye.on { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 40%, transparent); background: var(--yellow-soft); }
    .mny-in { -webkit-text-security: none; }
    body.hide-amt .mny-in { -webkit-text-security: disc; text-security: disc; }
    #syncBtn { margin-left: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
      font: 600 11px/1 var(--mono); letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--faint); }
    .dot.ok { background: var(--pos); box-shadow: 0 0 8px var(--pos); } .dot.warn { background: var(--yellow); } .dot.err { background: var(--neg); }
    main { padding: 4px 16px 24px; max-width: 680px; margin: 0 auto; }
    .card { background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 12px 0; box-shadow: var(--shadow); }
    h2 { font: 600 11.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); margin: 22px 2px 8px; }
    h2 .acc { color: var(--cyan); }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); font-size: 12.5px; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos { color: var(--pos); } .neg { color: var(--neg); } .cyan { color: var(--cyan); } .yellow { color: var(--yellow); } .purple { color: var(--purple); }
    .num, .big, .kpis .v, .tbl td, .tag, .levels button b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .num { white-space: nowrap; }
    b, strong { font-weight: 600; }
    .hero { padding: 18px 16px 14px; }
    .hero .lbl { font: 600 11.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
    .hero .chg { display: inline-block; font: 600 12.5px/1.6 var(--mono); padding: 1px 10px; border-radius: 999px; }
    .hero .chg.pos { background: var(--pos-soft); } .hero .chg.neg { background: var(--neg-soft); } .hero .chg.muted { background: var(--raise); }
    .hero .big { font-size: 38px; font-weight: 700; line-height: 1.05; margin: 8px 0 6px; letter-spacing: -.02em; color: var(--text); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 14px; background: var(--line2); border-radius: var(--r-sm); overflow: hidden; }
    .kpis > div { padding: 10px 8px 9px; min-width: 0; background: var(--card2); }
    .kpis .k { font: 600 9.5px/1.2 var(--mono); letter-spacing: 0; color: var(--muted); white-space: nowrap; }
    .kpis > div { min-width: 0; }
    .hero .muted.num { white-space: normal; }
    .kv { flex-wrap: wrap; row-gap: 2px; }
    .kv > span:last-child { margin-left: auto; text-align: right; }
    .tbl th, .tbl td { padding-left: 3px; padding-right: 3px; }
    .tbl th { letter-spacing: .03em; }
    .seg button { letter-spacing: 0; padding-left: 1px; padding-right: 1px; }
    .tbl td:first-child, .tbl th:first-child { white-space: normal; overflow-wrap: anywhere; }
    .kpis .v { font-weight: 700; font-size: 15px; margin-top: 4px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { text-align: right; font: 600 10.5px/1 var(--mono); color: var(--muted); letter-spacing: .08em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    .tbl td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line2); }
    .tbl th:first-child, .tbl td:first-child { text-align: left; font-family: var(--sans); }
    .tbl tr:last-child td { border-bottom: 0; }
    .list > .item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line2); }
    .list > .item:first-child { border-top: 0; }
    .tap { cursor: pointer; }
    .tap:active { opacity: .75; }
    .tag { display: inline-block; font-size: 9.5px; font-weight: 600; line-height: 1.5; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px;
      background: var(--raise); color: var(--muted); vertical-align: 1px; }
    .tag.W, .tag.HW { color: var(--pos); background: var(--pos-soft); } .tag.L, .tag.HL { color: var(--neg); background: var(--neg-soft); }
    .tag.P { color: var(--yellow); background: var(--yellow-soft); } .tag.V { color: var(--muted); } .tag.CO { color: var(--purple); background: var(--purple-soft); }
    .tag.mine { color: var(--cyan); background: var(--cyan-soft); }
    button { font: 600 13px/1.2 var(--sans); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer;
      background: var(--raise); color: var(--text); letter-spacing: .02em; transition: transform .08s, background .15s; }
    button:active { transform: scale(.98); }
    button.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); font-weight: 700;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 22%, transparent); }
    button.danger { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); background: var(--neg-soft); }
    button.small { padding: 7px 12px; font-size: 12px; border-radius: 999px; }
    button.block { width: 100%; }
    button:disabled { opacity: .45; }
    .pend { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 10px 0; background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: inset 3px 0 0 var(--yellow), var(--shadow); }
    .pend .btns { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; margin-top: 12px; }
    .pend .btns button { padding: 13px 4px; font: 700 12px/1 var(--mono); letter-spacing: .06em; }
    .btn-w { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 35%, transparent); background: var(--pos-soft); }
    .btn-l { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); background: var(--neg-soft); }
    .btn-v { color: var(--muted); }
    /* Botón flotante "+" (estilo WhatsApp): abajo a la derecha, encima de la barra, siempre visible al hacer scroll. */
    .fab { position: fixed; right: max(18px, calc((100% - 680px) / 2 + 18px)); bottom: calc(86px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px;
      font-size: 30px; line-height: 1; padding: 0; background: var(--brand); border: 0; color: var(--on-brand); z-index: 8; font-weight: 600;
      box-shadow: 0 10px 28px color-mix(in srgb, var(--ac) 35%, transparent), 0 2px 8px rgba(0, 0, 0, .7); transition: transform .12s; }
    .fab:active { transform: scale(.92); }
    nav.tabs { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 7; display: grid; grid-template-columns: repeat(5, 1fr);
      background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line); border-radius: 20px; padding: 6px; max-width: 660px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
    nav.tabs button { background: none; border: 0; border-radius: 14px; padding: 7px 0 6px; font: 600 10px/1.1 var(--mono); letter-spacing: .06em;
      color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    nav.tabs button .ic { display: block; line-height: 1; height: 22px; margin-bottom: 3px; }
    .ico { display: block; margin: 0 auto; }
    nav.tabs button.active { color: var(--ac); background: color-mix(in srgb, var(--ac) 15%, transparent); }
    label { display: block; font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); margin: 16px 2px 7px; }
    input, select, textarea { font: 16px/1.3 var(--sans); width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card2); color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: color-mix(in srgb, var(--pos) 55%, transparent); box-shadow: 0 0 0 3px var(--pos-soft); }
    input[type=date], input[type=time] { color-scheme: dark; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--pos); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
