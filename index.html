<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06110a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Betting">
  <title>Betting</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Diseño v2 (25/10/2026): mismo color (negro + verde "de pasta"), acabado más fino como Zontes:
       esquinas suaves, bordes finos, superficies con leve relieve, barra flotante.
       JetBrains Mono para cifras y etiquetas; Inter para los textos. */
    :root {
      /* Fondo "verde tapete" (25/10/2026): casi negro con un toque de verde; tarjetas un escalón más claras. */
      --bg: #06110a; --card: #0b1c12; --card2: #08160e; --raise: #10261a; --text: #d4e8da; --muted: #7fa98a; --faint: #557a62;
      --line: #1d3d29; --line2: #132a1c;
      --pos: #5fcf98; --pos-soft: rgba(95, 207, 152, .13); --money: #5fcf98; --money-dark: #123524;
      --neg: #ef7b73; --neg-soft: rgba(239, 123, 115, .13);
      --cyan: #7cc6d1; --cyan-soft: rgba(124, 198, 209, .13);
      --yellow: #e9c47a; --yellow-soft: rgba(233, 196, 122, .13);
      --purple: #b9a6e6; --purple-soft: rgba(185, 166, 230, .13);
      --r: 16px; --r-sm: 12px; --r-xs: 9px;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 8px 22px rgba(0, 0, 0, .45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(150px + env(safe-area-inset-bottom));
      background: radial-gradient(120% 55% at 50% -10%, rgba(0, 230, 118, .06) 0%, rgba(6, 17, 10, 0) 60%) fixed, var(--bg); }
    header { position: sticky; top: 0; z-index: 5; background: rgba(6, 17, 10, .8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line2); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; border-radius: 8px; }
    header h1 { margin: 0; font: 700 14px/1 var(--mono); letter-spacing: .14em; color: var(--text); }
    header h1::first-letter { color: var(--pos); }
    #syncBtn { margin-left: auto; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
      font: 600 10px/1 var(--mono); letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--faint); }
    .dot.ok { background: var(--pos); box-shadow: 0 0 8px var(--pos); } .dot.warn { background: var(--yellow); } .dot.err { background: var(--neg); }
    main { padding: 4px 16px 24px; max-width: 680px; margin: 0 auto; }
    .card { background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 12px 0; box-shadow: var(--shadow); }
    h2 { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); margin: 22px 2px 8px; }
    h2 .acc { color: var(--cyan); }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); font-size: 12.5px; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos { color: var(--pos); } .neg { color: var(--neg); } .cyan { color: var(--cyan); } .yellow { color: var(--yellow); } .purple { color: var(--purple); }
    .num, .big, .kpis .v, .tbl td, .tag, .pk b, .pkc b, .levels button b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .num { white-space: nowrap; }
    b, strong { font-weight: 600; }
    .hero { padding: 18px 16px 14px; }
    .hero .lbl { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
    .hero .chg { display: inline-block; font: 600 12.5px/1.6 var(--mono); padding: 1px 10px; border-radius: 999px; }
    .hero .chg.pos { background: var(--pos-soft); } .hero .chg.neg { background: var(--neg-soft); } .hero .chg.muted { background: var(--raise); }
    .hero .big { font-size: 38px; font-weight: 700; line-height: 1.05; margin: 8px 0 6px; letter-spacing: -.02em; color: var(--text); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 14px; background: var(--line2); border-radius: var(--r-sm); overflow: hidden; }
    .kpis > div { padding: 10px 8px 9px; min-width: 0; background: var(--card2); }
    .kpis .k { font: 600 9.5px/1.2 var(--mono); letter-spacing: .1em; color: var(--muted); }
    .kpis .v { font-weight: 700; font-size: 15px; margin-top: 4px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { text-align: right; font: 600 9.5px/1 var(--mono); color: var(--muted); letter-spacing: .08em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    .tbl td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line2); }
    .tbl th:first-child, .tbl td:first-child { text-align: left; font-family: var(--sans); }
    .tbl tr:last-child td { border-bottom: 0; }
    .list > .item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line2); }
    .list > .item:first-child { border-top: 0; }
    .tap { cursor: pointer; }
    .tap:active { opacity: .75; }
    .tag { display: inline-block; font-size: 9.5px; font-weight: 600; line-height: 1.5; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px;
      background: var(--raise); color: var(--muted); vertical-align: 1px; }
    .tag.W, .tag.HW { color: var(--pos); background: var(--pos-soft); } .tag.L, .tag.HL { color: var(--neg); background: var(--neg-soft); }
    .tag.P { color: var(--yellow); background: var(--yellow-soft); } .tag.V { color: var(--muted); } .tag.CO { color: var(--purple); background: var(--purple-soft); }
    .tag.mine { color: var(--cyan); background: var(--cyan-soft); }
    button { font: 600 13px/1.2 var(--sans); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer;
      background: var(--raise); color: var(--text); letter-spacing: .02em; transition: transform .08s, background .15s; }
    button:active { transform: scale(.98); }
    button.primary { background: linear-gradient(180deg, #33ff99 0%, var(--pos) 100%); border-color: transparent; color: #001a0b; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 230, 118, .22); }
    button.danger { color: var(--neg); border-color: rgba(255, 82, 82, .35); background: var(--neg-soft); }
    button.small { padding: 7px 12px; font-size: 12px; border-radius: 999px; }
    button.block { width: 100%; }
    button:disabled { opacity: .45; }
    .pend { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 10px 0; background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: inset 3px 0 0 var(--yellow), var(--shadow); }
    .pend .btns { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; margin-top: 12px; }
    .pend .btns button { padding: 13px 4px; font: 700 12px/1 var(--mono); letter-spacing: .06em; }
    .btn-w { color: var(--pos); border-color: rgba(0, 230, 118, .35); background: var(--pos-soft); }
    .btn-l { color: var(--neg); border-color: rgba(255, 82, 82, .35); background: var(--neg-soft); }
    .btn-v { color: var(--muted); }
    /* Botón flotante "+" (estilo WhatsApp): abajo a la derecha, encima de la barra, siempre visible al hacer scroll. */
    .fab { position: fixed; right: max(18px, calc((100% - 680px) / 2 + 18px)); bottom: calc(86px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px;
      font-size: 30px; line-height: 1; padding: 0; background: linear-gradient(180deg, #33ff99, var(--pos)); border: 0; color: #001a0b; z-index: 8; font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 230, 118, .3), 0 2px 8px rgba(0, 0, 0, .7); transition: transform .12s; }
    .fab:active { transform: scale(.92); }
    nav.tabs { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 7; display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(11, 28, 18, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line); border-radius: 20px; padding: 6px; max-width: 660px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
    nav.tabs button { background: none; border: 0; border-radius: 14px; padding: 7px 0 6px; font: 600 9px/1.1 var(--mono); letter-spacing: .06em;
      color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    nav.tabs button .ic { font-size: 16px; line-height: 1.1; }
    nav.tabs button.active { color: var(--pos); background: var(--pos-soft); }
    label { display: block; font: 600 10px/1 var(--mono); letter-spacing: .12em; color: var(--muted); margin: 16px 2px 7px; }
    input, select, textarea { font: 16px/1.3 var(--sans); width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card2); color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(0, 230, 118, .55); box-shadow: 0 0 0 3px var(--pos-soft); }
    input[type=date], input[type=time] { color-scheme: dark; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--pos); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 8px 12px; font-size: 12.5px; font-weight: 500; background: var(--card2); border-radius: 999px; }
    .chips button.on { background: var(--pos-soft); color: var(--text); border-color: rgba(0, 230, 118, .4); }
    .scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .scroll-x button { flex: none; }
    .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .levels button { padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--card2); border-radius: var(--r-xs); }
    .levels button b { font-size: 16px; font-weight: 700; }
    .levels button span { font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
    .levels button.on { background: var(--pos-soft); border-color: rgba(0, 230, 118, .45); color: var(--text); }
    .levels button.on span { color: var(--muted); }
    .res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .res button { padding: 10px 2px; font: 600 10.5px/1.1 var(--mono); letter-spacing: .04em; background: var(--card2); border-radius: var(--r-xs); }
    .res button.on[data-r=P] { background: var(--yellow-soft); border-color: rgba(255, 213, 79, .5); color: var(--yellow); }
    .res button.on[data-r=W], .res button.on[data-r=HW] { background: var(--pos-soft); border-color: rgba(0, 230, 118, .5); color: var(--pos); }
    .res button.on[data-r=L], .res button.on[data-r=HL] { background: var(--neg-soft); border-color: rgba(255, 82, 82, .5); color: var(--neg); }
    .res button.on[data-r=V] { background: var(--raise); border-color: var(--muted); color: var(--text); }
    .res button.on[data-r=CO] { background: var(--purple-soft); border-color: rgba(179, 136, 255, .5); color: var(--purple); }
    .leg { display: grid; grid-template-columns: 1fr 92px 40px; gap: 6px; margin-bottom: 6px; }
    .leg button { padding: 0; }
    .preview { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card2); padding: 10px 12px; margin-top: 10px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: linear-gradient(180deg, var(--card), var(--bg)); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; width: 100%; max-width: 680px; max-height: 94vh; overflow-y: auto;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .6); }
    .sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: rgba(215, 245, 222, .18); margin: 0 auto 12px; }
    .sheet h3 { margin: 0 0 6px; font: 700 14px/1.3 var(--mono); letter-spacing: .1em; color: var(--text); }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .actions button { flex: 1; }
    .overlay.dialog { z-index: 40; align-items: center; padding: 16px; }
    .dlg { background: var(--card); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 380px; padding: 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .7); }
    .empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 12.5px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(160px + env(safe-area-inset-bottom)); border-radius: 999px;
      background: rgba(16, 38, 26, .97); border: 1px solid rgba(0, 230, 118, .35); color: var(--text); padding: 10px 16px; z-index: 50; font-size: 13px; font-weight: 600;
      max-width: 90vw; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
    .banner { border: 1px solid rgba(255, 82, 82, .35); border-radius: var(--r-sm); background: var(--neg-soft); color: var(--neg); padding: 11px 13px; margin: 12px 0; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; font-size: 11px; white-space: nowrap; display: none; }
    .datehdr { font: 600 10px/1 var(--mono); letter-spacing: .12em; color: var(--muted); margin: 18px 2px 4px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .filters select { font-size: 13px; padding: 9px 8px; }
    .login { max-width: 400px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px 40px; text-align: center; }
    .login img { width: 120px; height: 120px; border-radius: 28px; }
    .login h1 { margin: 12px 0 4px; font: 700 19px/1.2 var(--mono); letter-spacing: .2em; color: var(--text); }
    .login .card { text-align: left; }
    .seg { display: flex; gap: 4px; padding: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; }
    .seg button { flex: 1; border: 0; border-radius: 10px; padding: 9px 2px; font: 600 10.5px/1 var(--mono); letter-spacing: .06em; background: none; color: var(--muted); }
    .seg button.on { background: var(--raise); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .45); }
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 13px; }
    .kv:last-child { border-bottom: 0; }
    .kv > span:first-child { font: 600 10.5px/1.4 var(--mono); letter-spacing: .06em; }
    .listedit .chips button { padding-right: 8px; }
    .listedit .chips button i { font-style: normal; color: var(--neg); margin-left: 6px; }
    .pickrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .pk { background: var(--card2); border-radius: var(--r-sm); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-weight: 400; letter-spacing: 0; min-width: 0; }
    .pk .o { font: 600 10.5px/1.3 var(--mono); color: var(--muted); }
    .pk b { font-size: 16px; font-weight: 700; }
    .pk span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .pk.fav { border-color: rgba(77, 208, 225, .55); } .pk.fav .o { color: var(--cyan); }
    .pk.val { border-color: rgba(255, 213, 79, .55); background: var(--yellow-soft); } .pk.val .o { color: var(--yellow); }
    .lg { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
    .lg:last-of-type { border-bottom: 0; }
    .lg .chk { width: 30px; height: 30px; padding: 0; background: var(--card2); border-radius: 9px; font-weight: 800; }
    .lg .chk.on { background: var(--pos-soft); border-color: rgba(0, 230, 118, .45); color: var(--text); }
    .lg .star { width: 34px; height: 30px; padding: 0; background: var(--card2); border-radius: 9px; filter: grayscale(1); opacity: .35; }
    .lg .star.on { filter: none; opacity: 1; border-color: rgba(255, 213, 79, .5); background: var(--yellow-soft); }
    .lg .rm { width: 30px; height: 30px; padding: 0; color: var(--neg); background: none; border-color: transparent; border-radius: 9px; }
    .pkcard { border: 1px solid var(--line); border-radius: var(--r); background: linear-gradient(180deg, var(--card), var(--card2)); padding: 11px 12px 12px; margin: 8px 0; box-shadow: var(--shadow); }
    .pkcard.v { box-shadow: inset 3px 0 0 var(--yellow), var(--shadow); }
    .pkhead { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .pkhead .tag { flex: none; }
    .pkrow { display: grid; gap: 6px; margin-top: 8px; }
    .pkc { background: var(--card2); border-radius: var(--r-xs); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 0; font-weight: 400; letter-spacing: 0; min-width: 0; }
    .pkc .o { font: 600 10px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .pkc b { font-size: 14px; font-weight: 700; }
    .pkc span.cyan { font: 500 11px/1.3 var(--mono); }
    .pkc.fav { border-color: rgba(77, 208, 225, .55); } .pkc.fav .o { color: var(--cyan); }
    .pkc.val { border-color: rgba(255, 213, 79, .55); background: var(--yellow-soft); } .pkc.val .o { color: var(--yellow); }
    .pkfilters { margin-top: 8px; }
    #pfLeague { font-size: 13px; padding: 9px 10px; }
    .pkfilters button { font-size: 12px; padding: 7px 11px; }
    .pkfilters .sep { flex: none; width: 1px; background: var(--line); margin: 0 2px; }
    a { color: var(--cyan); }
    body.noapp header, body.noapp nav.tabs, body.noapp .fab { display: none; }
  </style>
</head>
<body class="noapp">
  <header>
    <img src="favicon.png" alt="">
    <h1>BETTING</h1>
    <button id="syncBtn" aria-label="Sincronizar"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></button>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Nueva apuesta">+</button>
  <nav class="tabs">
    <button data-tab="home" class="active"><span class="ic">🏠</span>INICIO</button>
    <button data-tab="bets"><span class="ic">⚡</span>APUESTAS</button>
    <button data-tab="picks"><span class="ic">🔥</span>PICKS</button>
    <button data-tab="stats"><span class="ic">📈</span>STATS</button>
    <button data-tab="settings"><span class="ic">⚙</span>AJUSTES</button>
  </nav>
  <script src="version.js?v=15"></script>
  <script src="logic.js?v=15"></script>
  <script src="store.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
